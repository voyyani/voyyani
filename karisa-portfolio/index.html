<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon (served locally: the Cloudinary-hosted originals were a third-party
         dependency on every page load for a 1KB icon, and a 1024x1024 PNG at that) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0C" />

    <!--
      Title, description, canonical, Open Graph, Twitter card and JSON-LD are injected
      here at BUILD time by the `inject-seo-meta` plugin in vite.config.js, from the
      single definition in src/config/seo.js.

      Do not hand-write them here. They previously existed only inside react-helmet-async,
      which meant they were never in the served HTML at all — so every social share
      rendered as a bare link with no image. Editing them here instead of in
      src/config/seo.js would reintroduce the drift that setup exists to prevent.

      The build FAILS if this placeholder is removed.
    -->
    <!--%SEO_META%-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
